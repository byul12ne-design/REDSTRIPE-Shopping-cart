<script>
        document.addEventListener('DOMContentLoaded', function() {
            const config = {
                model: 'standard',
                drawerCount: 5,
                currentDrawer: 1,
                selectedInlay: null,
                drawers: [],
                inlays: [] // 일단 배열을 텅 비워둡니다.
            };

            // 새로 추가하는 부분: data.json에서 데이터를 불러옵니다!
            fetch('data.json')
                .then(response => response.json())
                .then(data => {
                    config.inlays = data; // 불러온 데이터를 빈 배열에 채워 넣습니다.
                    renderInlays(); // 화면을 다시 그립니다.
                })
                .catch(error => console.error('데이터 로드 에러:', error));
